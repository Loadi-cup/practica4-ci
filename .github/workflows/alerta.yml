name: Alerta

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node hola.js

      - name: Enviar notificación a ntfy
        run: |
          curl -d "Nuevo push a main en ${{ github.repository }} por ${{ github.actor }}: ${{ github.event.head_commit.message }}" https://ntfy.sh/devops-itla
